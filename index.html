<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Bateria</title>
    <link rel="stylesheet" href="style.css?v=ios9-1">
</head>
<body>
    <div class="container">
        <h1>Drum Practice Web App</h1>

        <div class="control-group">
            <label for="audio-upload">Escolher Faixa de Áudio</label>
            <input type="file" id="audio-upload" accept="audio/*,.mp3,.m4a,.wav,.aac">
        </div>

        <p id="status" role="status" aria-live="polite">
            Escolha uma música para começar.
        </p>

        <noscript>
            Ative o JavaScript no Safari para usar o player.
        </noscript>

        <div class="player-controls">
            <button type="button" id="play-pause-btn" disabled>Play</button>
            <button type="button" id="stop-btn" disabled>Stop</button>
        </div>

        <div class="timeline">
            <label class="sr-only" for="progress-bar">Posição da música</label>
            <input type="range" id="progress-bar" value="0" max="100" step="0.1" disabled>

            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="sliders">
            <div class="control-group">
                <label for="speed-slider">
                    Velocidade: <span id="speed-val">1.00x</span>
                </label>
                <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.05" value="1" disabled>
            </div>

            <div class="control-group">
                <label for="pitch-slider">
                    Tom (Semitons): <span id="pitch-val">0</span>
                </label>
                <input type="range" id="pitch-slider" min="-12" max="12" step="1" value="0" disabled>
            </div>
        </div>

        <p class="note">
            Nesta versão, velocidade e tom estão ligados:
            mudar um também altera o outro.
            Para ouvir o original, use 1.00x e 0 semitons.
        </p>
    </div>

    <script src="script.js?v=ios9-1"></script>
</body>
</html>
