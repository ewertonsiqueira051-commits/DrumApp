<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DrummApp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 12px;
            background: #2c3e50;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 22px;
            background: #34495e;
            border-radius: 10px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 24px;
        }

        h2 {
            font-size: 20px;
            margin: 0 0 14px;
        }

        label {
            display: block;
            margin: 16px 0 10px;
        }

        input {
            max-width: 100%;
            font-size: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #8294a5;
            border-radius: 6px;
            background: #ffffff;
            color: #182b3b;
        }

        audio {
            display: block;
            width: 100%;
            margin: 22px 0;
        }

        button {
            min-height: 48px;
            padding: 12px 14px;
            margin: 6px 5px 6px 0;
            border: 0;
            border-radius: 6px;
            background: #2980b9;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #687887;
            cursor: default;
        }

        .secondary {
            background: #465f75;
        }

        p {
            line-height: 1.5;
            word-wrap: break-word;
        }

        #status {
            min-height: 48px;
        }

        .note {
            font-size: 14px;
            color: #e0e7ed;
        }

        .youtube-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #647789;
        }

        #youtube-player iframe {
            display: block;
            width: 100%;
            height: 240px;
            border: 0;
            margin-top: 16px;
        }

        #youtube-link {
            display: inline-block;
            color: #ffffff;
            margin: 10px 0;
        }

        #youtube-actions {
            display: none;
        }
    </style>
</head>

<body>
    <main>
        <h1>DrummApp</h1>

        <label for="file">
            Escolher música do iCloud Drive
        </label>

        <input
            id="file"
            type="file"
            accept="audio/*,.mp3,.m4a,.aac,.wav"
        >

        <p id="status" role="status" aria-live="polite">
            Aguardando a inicialização do player...
        </p>

        <div id="player"></div>

        <div>
            <button id="play" type="button" disabled>
                Play / Pausar
            </button>

            <button id="stop" type="button" disabled>
                Voltar ao início
            </button>
        </div>

        <div>
            <button
                id="back"
                type="button"
                class="secondary"
                disabled
            >
                −10 segundos
            </button>

            <button
                id="forward"
                type="button"
                class="secondary"
                disabled
            >
                +10 segundos
            </button>
        </div>

        <p class="note">
            Os botões acima controlam a música do iCloud.
            Ao recarregar a página, selecione o arquivo novamente.
        </p>

        <section class="youtube-section">
            <h2>YouTube</h2>

            <label for="youtube-url">
                Cole o link de um vídeo
            </label>

            <input
                id="youtube-url"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
            >

            <button id="youtube-open" type="button">
                Abrir vídeo
            </button>

            <p
                id="youtube-status"
                class="note"
                role="status"
                aria-live="polite"
            >
                O YouTube só será carregado quando você abrir
                um vídeo. Use os controles do próprio vídeo
                para reproduzir e avançar.
            </p>

            <div id="youtube-player"></div>

            <div id="youtube-actions">
                <a
                    id="youtube-link"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Abrir no YouTube
                </a>

                <br>

                <button
                    id="youtube-close"
                    type="button"
                    class="secondary"
                >
                    Fechar vídeo
                </button>
            </div>
        </section>

        <noscript>
            Ative o JavaScript no Safari para usar este player.
        </noscript>
    </main>

    <script>
    (function () {
        'use strict';

        var input = document.getElementById('file');
        var box = document.getElementById('player');
        var status = document.getElementById('status');
        var play = document.getElementById('play');
        var stop = document.getElementById('stop');
        var back = document.getElementById('back');
        var forward = document.getElementById('forward');

        var youtubeInput = document.getElementById('youtube-url');
        var youtubeOpen = document.getElementById('youtube-open');
        var youtubeClose = document.getElementById('youtube-close');
        var youtubeBox = document.getElementById('youtube-player');
        var youtubeStatus = document.getElementById('youtube-status');
        var youtubeActions = document.getElementById('youtube-actions');
        var youtubeLink = document.getElementById('youtube-link');

        var urls = window.URL;

        if (!urls || !urls.createObjectURL) {
            urls = window.webkitURL;
        }

        var audio = null;
        var objectURL = null;
        var timer = null;

        function say(text) {
            status.textContent = text;
        }

        function clearTimer() {
            window.clearTimeout(timer);
            timer = null;
        }

        function setButtons(enabled) {
            play.disabled = !enabled;
            stop.disabled = !enabled;
            back.disabled = !enabled;
            forward.disabled = !enabled;
        }

        function closeYouTube() {
            youtubeBox.innerHTML = '';
            youtubeActions.style.display = 'none';

            youtubeStatus.textContent =
                'Cole um link e toque em Abrir vídeo.';
        }

        function release() {
            clearTimer();

            var previous = audio;
            audio = null;

            if (previous) {
                try {
                    previous.pause();
                    previous.removeAttribute('src');
                    previous.load();
                } catch (ignoreAudio) {}
            }

            box.innerHTML = '';

            if (objectURL) {
                try {
                    urls.revokeObjectURL(objectURL);
                } catch (ignoreURL) {}

                objectURL = null;
            }

            setButtons(false);
        }

        function jump(seconds) {
            if (!audio) {
                return;
            }

            if (audio.readyState < 1) {
                say(
                    'Toque em Play e aguarde o áudio iniciar ' +
                    'antes de avançar ou voltar.'
                );
                return;
            }

            try {
                var current = audio.currentTime || 0;
                var target = Math.max(0, current + seconds);

                if (isFinite(audio.duration)) {
                    target = Math.min(audio.duration, target);
                }

                audio.currentTime = target;

                say(
                    seconds < 0 ?
                    'Posição ajustada para trás.' :
                    'Posição ajustada para frente.'
                );
            } catch (error) {
                say(
                    'Ainda não foi possível mudar a posição. ' +
                    'Aguarde a música carregar e tente novamente.'
                );
            }
        }

        input.addEventListener('change', function () {
            var file = input.files && input.files[0];

            if (!file) {
                say(
                    'O Safari não disponibilizou o arquivo. ' +
                    'Abra a música no iCloud, aguarde o download ' +
                    'e selecione novamente.'
                );
                return;
            }

            release();

            if (!urls || !urls.createObjectURL) {
                say(
                    'Este navegador não permite abrir ' +
                    'o arquivo dessa forma.'
                );
                input.value = '';
                return;
            }

            if (!file.size) {
                say(
                    'O arquivo está vazio ou indisponível. ' +
                    'Abra-o no iCloud, espere baixar ' +
                    'e selecione novamente.'
                );
                input.value = '';
                return;
            }

            try {
                var player = document.createElement('audio');

                audio = player;
                player.controls = true;
                player.preload = 'none';

                player.setAttribute(
                    'aria-label',
                    'Player da música'
                );

                var on = function (event, action) {
                    player.addEventListener(event, function () {
                        if (audio === player) {
                            action();
                        }
                    });
                };

                on('play', function () {
                    if (youtubeBox.firstChild) {
                        closeYouTube();
                    }
                });

                on('playing', function () {
                    clearTimer();
                    say('Reproduzindo: ' + file.name);
                });

                on('pause', function () {
                    clearTimer();

                    if (!player.ended && !player.error) {
                        say(
                            'Pausado. Toque em Play ' +
                            'para continuar.'
                        );
                    }
                });

                on('waiting', function () {
                    say(
                        'Aguardando o áudio. Se o arquivo ' +
                        'veio da nuvem, o download pode ' +
                        'levar um tempo.'
                    );
                });

                on('ended', function () {
                    clearTimer();

                    say(
                        'Fim da música. Toque em Play ' +
                        'para ouvir novamente.'
                    );
                });

                on('error', function () {
                    clearTimer();

                    var code = player.error ?
                        player.error.code : 0;

                    say(
                        'O Safari não conseguiu reproduzir ' +
                        'este arquivo (código ' + code + '). ' +
                        'Abra-o no iCloud e selecione novamente. ' +
                        'Se persistir, teste uma cópia em MP3.'
                    );

                    input.value = '';
                });

                objectURL = urls.createObjectURL(file);
                player.src = objectURL;

                box.appendChild(player);
                player.load();

                setButtons(true);

                say(
                    'Arquivo selecionado: ' + file.name +
                    '. Toque em Play para iniciar.'
                );

            } catch (error) {
                release();
                input.value = '';

                say(
                    'Não foi possível abrir o arquivo. ' +
                    'Selecione novamente pelo iCloud Drive.'
                );
            }
        });

        play.addEventListener('click', function () {
            if (!audio) {
                return;
            }

            var player = audio;

            if (!player.paused && !player.ended) {
                player.pause();
                return;
            }

            if (youtubeBox.firstChild) {
                closeYouTube();
            }

            clearTimer();
            say('Iniciando a reprodução...');

            timer = window.setTimeout(function () {
                if (audio === player && !player.error) {
                    say(
                        'Se ainda não houver som, toque ' +
                        'no Play do player acima.'
                    );
                }
            }, 20000);

            try {
                if (player.ended) {
                    player.currentTime = 0;
                }

                var result = player.play();

                if (result && result.then) {
                    result.then(
                        function () {},
                        function () {
                            if (audio === player) {
                                clearTimer();

                                say(
                                    'Não foi possível iniciar. ' +
                                    'Toque no Play do player acima ' +
                                    'ou selecione o arquivo novamente.'
                                );
                            }
                        }
                    );
                }

            } catch (error) {
                clearTimer();

                say(
                    'Toque no Play do player acima ' +
                    'para iniciar.'
                );
            }
        });

        stop.addEventListener('click', function () {
            if (!audio) {
                return;
            }

            audio.pause();
            clearTimer();

            try {
                audio.currentTime = 0;
                say('No início da música. Toque em Play.');
            } catch (error) {
                say(
                    'Pausado. Inicie a reprodução antes ' +
                    'de voltar ao início.'
                );
            }
        });

        back.addEventListener('click', function () {
            jump(-10);
        });

        forward.addEventListener('click', function () {
            jump(10);
        });

        function getYouTubeID(text) {
            var raw = text.replace(/^\s+|\s+$/g, '');

            if (!raw) {
                return null;
            }

            if (!/^https?:\/\//i.test(raw)) {
                raw = 'https://' + raw;
            }

            var link = document.createElement('a');
            link.href = raw;

            var host = link.hostname.toLowerCase();
            var path = link.pathname;
            var id = '';
            var match;

            if (host === 'youtu.be') {
                id = path.split('/')[1];

            } else if (
                /^(www\.|m\.|music\.)?youtube\.com$/.test(host)
            ) {
                match = link.search.match(
                    /[?&]v=([A-Za-z0-9_-]{11})(?:&|$)/
                );

                if (match) {
                    id = match[1];
                } else {
                    match = path.match(
                        /^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})(?:\/|$)/
                    );

                    if (match) {
                        id = match[1];
                    }
                }
            }

            return /^[A-Za-z0-9_-]{11}$/.test(id) ?
                id : null;
        }

        youtubeOpen.addEventListener('click', function () {
            var id = getYouTubeID(youtubeInput.value);

            if (!id) {
                youtubeStatus.textContent =
                    'Cole um link válido de vídeo do YouTube.';
                return;
            }

            if (audio) {
                audio.pause();
                clearTimer();
            }

            closeYouTube();

            var frame = document.createElement('iframe');

            frame.title = 'Vídeo do YouTube';
            frame.setAttribute('allowfullscreen', '');
            frame.setAttribute(
                'allow',
                'encrypted-media; fullscreen'
            );

            frame.src =
                'https://www.youtube.com/embed/' + id +
                '?playsinline=1&autoplay=0';

            youtubeBox.appendChild(frame);

            youtubeLink.href =
                'https://www.youtube.com/watch?v=' + id;

            youtubeActions.style.display = 'block';

            youtubeStatus.textContent =
                'Toque em Play dentro do vídeo. ' +
                'Se ele não funcionar neste iPad, ' +
                'tente o link Abrir no YouTube.';
        });

        youtubeClose.addEventListener('click', closeYouTube);

        setButtons(false);
        say('Escolha uma música no iCloud Drive.');

    }());
    </script>
</body>
</html>
