<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — DrummApp</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background: #34495e;
    color: white;
    font-family: Arial, sans-serif;
}

main {
    max-width: 800px;
    margin: auto;
    padding: 22px;
}

h1 { font-size: 28px; }

p {
    line-height: 1.5;
    word-wrap: break-word;
}

label {
    display: block;
    margin: 14px 0 6px;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #8294a5;
    border-radius: 6px;
}

button, .link-button {
    display: inline-block;
    min-height: 46px;
    margin: 6px 4px 6px 0;
    padding: 12px 16px;
    border: 0;
    border-radius: 6px;
    background: #2980b9;
    color: white;
    font-size: 16px;
    text-decoration: none;
}

button:disabled {
    background: #687887;
}

.delete {
    background: #b23b32;
}

.note {
    color: #e0e7ed;
    font-size: 14px;
}

.card {
    padding: 18px 0;
    border-top: 1px solid #8294a5;
}

.track-name {
    font-weight: bold;
    word-wrap: break-word;
}

audio {
    display: block;
    width: 100%;
    margin: 14px 0;
}

#login-panel {
    margin: 16px 0;
    padding: 16px;
    border: 1px solid #8294a5;
    border-radius: 8px;
}

#logout, #more {
    display: none;
}

a { color: white; }
</style>
</head>

<body>
<main>

<h1>Biblioteca de músicas</h1>

<a class="link-button" href="./import.html">Adicionar música</a>
<a class="link-button" href="./index.html">Abrir DrummApp</a>

<p class="note">
    Ouça suas músicas abaixo. Para excluir, entre com
    o usuário que você criou no Supabase Authentication.
</p>

<div id="login-panel">
    <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" type="email"
               autocomplete="username"
               autocapitalize="off"
               autocorrect="off" required>

        <label for="password">Senha</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button id="login" type="submit">
            Entrar para excluir músicas
        </button>
    </form>
</div>

<p id="auth-status" role="status" aria-live="polite">
    Você pode ouvir sem fazer login.
</p>

<button id="logout" type="button">Sair</button>
<button id="refresh" type="button">Atualizar biblioteca</button>

<p id="status" role="status" aria-live="polite"></p>

<div id="list"></div>

<button id="more" type="button">Mostrar mais músicas</button>

</main>

<script src="./config.js"></script>

<script>
(function () {
    'use strict';

    function el(id) {
        return document.getElementById(id);
    }

    var cfg = window.DRUMMAPP_CONFIG || {};
    var base = (cfg.supabaseUrl || '').replace(/\/$/, '');
    var token = '';
    var busy = false;
    var offset = 0;
    var limit = 100;
    var deleteButtons = [];
    var expiryTimer = null;

    function say(text) {
        el('status').textContent = text;
    }

    function validConfig() {
        return base && cfg.supabaseAnonKey && cfg.bucket;
    }

    function updateDeleteButtons() {
        for (var i = 0; i < deleteButtons.length; i++) {
            deleteButtons[i].style.display =
                token ? 'inline-block' : 'none';

            deleteButtons[i].disabled = busy;
        }
    }

    function setBusy(value) {
        busy = value;
        el('refresh').disabled = value;
        el('more').disabled = value;
        el('login').disabled = value;
        el('logout').disabled = value;
        updateDeleteButtons();
    }

    function clearSession(text) {
        token = '';
        window.clearTimeout(expiryTimer);
        expiryTimer = null;

        el('login-panel').style.display = 'block';
        el('logout').style.display = 'none';
        el('password').value = '';
        el('auth-status').textContent =
            text || 'Sessão encerrada neste navegador.';

        updateDeleteButtons();
    }

    /*
     * O token fica somente na memória desta página.
     * Ao recarregar ou fechar, é necessário entrar novamente.
     */
    function request(method, path, data, sessionToken, callback) {
        var xhr = new XMLHttpRequest();
        var finished = false;

        function finish(error, result, status) {
            if (finished) {
                return;
            }

            finished = true;
            callback(error, result, status);
        }

        try {
            xhr.open(method, base + path, true);
            xhr.timeout = 30000;

            xhr.setRequestHeader('apikey', cfg.supabaseAnonKey);
            xhr.setRequestHeader('Content-Type', 'application/json');

            if (sessionToken) {
                xhr.setRequestHeader(
                    'Authorization',
                    'Bearer ' + sessionToken
                );
            } else if (cfg.supabaseAnonKey.indexOf('eyJ') === 0) {
                xhr.setRequestHeader(
                    'Authorization',
                    'Bearer ' + cfg.supabaseAnonKey
                );
            }

            xhr.onload = function () {
                var result = null;

                try {
                    result = JSON.parse(xhr.responseText || 'null');
                } catch (ignoreJSON) {}

                if (xhr.status < 200 || xhr.status >= 300) {
                    finish('Falha na solicitação.', result, xhr.status);
                    return;
                }

                finish(null, result, xhr.status);
            };

            xhr.onerror = function () {
                finish('Falha de conexão. Confira a internet.', null, 0);
            };

            xhr.ontimeout = function () {
                finish('A conexão demorou demais. Tente novamente.', null, 0);
            };

            xhr.send(data === null ? null : JSON.stringify(data));
        } catch (error) {
            finish('Não foi possível conectar ao serviço.', null, 0);
        }
    }

    function trackName(name) {
        return name.replace(/^\d{13}-/, '');
    }

    function addTrack(file) {
        if (!file || !file.id || !file.name) {
            return;
        }

        var card = document.createElement('div');
        var title = document.createElement('p');
        var player = document.createElement('audio');
        var remove = document.createElement('button');

        card.className = 'card';
        title.className = 'track-name';
        title.textContent = trackName(file.name);

        player.controls = true;
        player.preload = 'none';

        player.src = base +
            '/storage/v1/object/public/' +
            encodeURIComponent(cfg.bucket) + '/' +
            encodeURIComponent(file.name);

        remove.type = 'button';
        remove.className = 'delete';
        remove.textContent = 'Excluir música';

        remove.onclick = function () {
            if (busy || !token) {
                return;
            }

            var confirmed = window.confirm(
                'Excluir "' + trackName(file.name) + '"?\n\n' +
                'Ela será removida da biblioteca e do DrummApp. ' +
                'Para recuperá-la, será necessário enviar o arquivo novamente.'
            );

            if (!confirmed) {
                return;
            }

            setBusy(true);
            say('Excluindo: ' + trackName(file.name));

            request(
                'DELETE',
                '/storage/v1/object/' + encodeURIComponent(cfg.bucket),
                { prefixes: [file.name] },
                token,
                function (error, result, status) {
                    setBusy(false);

                    if (error) {
                        if (status === 401) {
                            clearSession('Seu acesso expirou. Entre novamente.');
                            say('Entre novamente antes de excluir.');
                        } else if (status === 403) {
                            say(
                                'Esse usuário não tem permissão para excluir. ' +
                                'Confira o UID nas regras do Supabase.'
                            );
                        } else {
                            say(
                                'Não foi possível confirmar a exclusão. ' +
                                'Atualize a biblioteca antes de tentar novamente.'
                            );
                        }

                        return;
                    }

                    /*
                     * A API pode responder com uma lista vazia quando
                     * nenhuma música foi removida por falta de permissão.
                     */
                    var removed = false;

                    if (
                        Object.prototype.toString.call(result) ===
                        '[object Array]'
                    ) {
                        for (var i = 0; i < result.length; i++) {
                            if (result[i].name === file.name) {
                                removed = true;
                            }
                        }
                    }

                    if (!removed) {
                        say(
                            'O serviço não confirmou a remoção dessa música. ' +
                            'Confira as permissões SELECT e DELETE do seu usuário ' +
                            'e atualize a biblioteca.'
                        );
                        return;
                    }

                    player.pause();
                    player.removeAttribute('src');
                    player.load();

                    loadLibrary(true, 'Música excluída.');
                }
            );
        };

        card.appendChild(title);
        card.appendChild(player);
        card.appendChild(remove);
        el('list').appendChild(card);

        deleteButtons.push(remove);
        updateDeleteButtons();
    }

    function loadLibrary(reset, notice) {
        if (busy) {
            return;
        }

        if (!validConfig()) {
            say('Confira o arquivo config.js.');
            return;
        }

        if (reset) {
            offset = 0;

            var players = el('list').getElementsByTagName('audio');
            for (var p = 0; p < players.length; p++) {
                players[p].pause();
            }

            el('list').innerHTML = '';
            deleteButtons = [];
        }

        el('more').style.display = 'none';
        setBusy(true);
        say('Carregando biblioteca...');

        /*
         * A listagem continua usando a permissão pública já existente.
         * Apenas a exclusão exige a sessão de administrador.
         */
        request(
            'POST',
            '/storage/v1/object/list/' + encodeURIComponent(cfg.bucket),
            {
                prefix: '',
                limit: limit,
                offset: offset,
                sortBy: { column: 'name', order: 'desc' }
            },
            '',
            function (error, files) {
                setBusy(false);

                if (
                    error ||
                    Object.prototype.toString.call(files) !== '[object Array]'
                ) {
                    say(
                        (notice ? notice + ' ' : '') +
                        'Não foi possível carregar a lista. Toque em Atualizar biblioteca.'
                    );

                    if (offset > 0) {
                        el('more').style.display = 'inline-block';
                    }

                    return;
                }

                for (var i = 0; i < files.length; i++) {
                    addTrack(files[i]);
                }

                offset += files.length;

                el('more').style.display =
                    files.length === limit ? 'inline-block' : 'none';

                var text = el('list').children.length ?
                    'Biblioteca atualizada.' :
                    'Nenhuma música na biblioteca.';

                say((notice ? notice + ' ' : '') + text);
            }
        );
    }

    el('login-form').addEventListener('submit', function (event) {
        event.preventDefault();

        if (busy || !validConfig()) {
            return;
        }

        var email = el('email').value.replace(/^\s+|\s+$/g, '');
        var password = el('password').value;

        if (!email || !password) {
            el('auth-status').textContent = 'Informe e-mail e senha.';
            return;
        }

        setBusy(true);
        el('auth-status').textContent = 'Entrando...';

        request(
            'POST',
            '/auth/v1/token?grant_type=password',
            { email: email, password: password },
            '',
            function (error, result) {
                setBusy(false);
                el('password').value = '';

                if (error || !result || !result.access_token) {
                    el('auth-status').textContent =
                        'Não foi possível entrar. Confira e-mail, senha e ' +
                        'a confirmação do usuário no Supabase Authentication.';
                    return;
                }

                token = result.access_token;

                el('login-panel').style.display = 'none';
                el('logout').style.display = 'inline-block';
                el('auth-status').textContent =
                    'Login realizado. A exclusão depende da permissão ' +
                    'configurada para esse usuário.';

                updateDeleteButtons();

                var seconds = Number(result.expires_in) || 3600;

                window.clearTimeout(expiryTimer);
                expiryTimer = window.setTimeout(function () {
                    clearSession('Seu acesso expirou. Entre novamente para excluir.');
                }, Math.max(1, seconds - 30) * 1000);
            }
        );
    });

    el('logout').addEventListener('click', function () {
        if (busy) {
            return;
        }

        var oldToken = token;
        clearSession();

        if (oldToken) {
            request(
                'POST',
                '/auth/v1/logout',
                null,
                oldToken,
                function () {}
            );
        }
    });

    el('refresh').addEventListener('click', function () {
        loadLibrary(true);
    });

    el('more').addEventListener('click', function () {
        loadLibrary(false);
    });

    loadLibrary(true);
}());
</script>
</body>
</html>
